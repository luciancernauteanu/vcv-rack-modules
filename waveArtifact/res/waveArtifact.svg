    <rect id="POS_LFO_TRIPLET_PARAM" x="42.9" y="90.2" width="4.2" height="4.4" fill="#ff0000"/>
    <rect id="POS_LFO_DOTTED_PARAM" x="47.8" y="90.2" width="4.2" height="4.4" fill="#ff0000"/>
    <circle id="POS_LFO_RATE_PARAM" cx="38.5" cy="98.8" r="3" fill="#ff0000"/>
    <circle id="POS_LFO_AMT_PARAM" cx="51" cy="98.8" r="3" fill="#ff0000"/>
    <circle id="FREQ_PARAM" cx="64.5" cy="90.5" r="4" fill="#ff0000"/>
    <circle id="VOCT_INPUT" cx="75.5" cy="90.5" r="4" fill="#00ff00"/>
    <rect id="MASTER_MODE_PARAM" x="84" y="82.7" width="10" height="5" fill="#ff0000"/>
    <circle id="MASTER_CUTOFF_PARAM" cx="101.5" cy="85.2" r="3.5" fill="#ff0000"/>
    <circle id="MASTER_CUTOFF_AMT_PARAM" cx="101.5" cy="92.4" r="3" fill="#ff0000"/>
    <circle id="MASTER_CUTOFF_INPUT" cx="101.5" cy="100" r="4" fill="#00ff00"/>
    <circle id="MASTER_RES_PARAM" cx="111.9" cy="85.2" r="3.5" fill="#ff0000"/>
    <circle id="MASTER_DRIVE_PARAM" cx="122.3" cy="85.2" r="3.5" fill="#ff0000"/>
    <circle id="MASTER_SPREAD_PARAM" cx="132.7" cy="85.2" r="3.5" fill="#ff0000"/>
    <circle id="MASTER_FDBK_PARAM" cx="143.1" cy="85.2" r="3.5" fill="#ff0000"/>
    <circle id="MASTER_GAIN_PARAM" cx="163.44" cy="85.4" r="3.5" fill="#ff0000"/>
    <circle id="LEFT_OUTPUT" cx="157.5" cy="97.6" r="4" fill="#0000ff"/>
    <circle id="RIGHT_OUTPUT" cx="169.5" cy="97.6" r="4" fill="#0000ff"/>
    <rect id="DOT_STRIP" x="6" y="108" width="170.88" height="12" fill="#ffff00"/>
