<?xml version="1.0" encoding="UTF-8"?>
<!-- 36 HP light panel. Geometry matches src/Layout.hpp.
     Labels are drawn at runtime by PanelLabels until they are added here as paths in Inkscape.
     Section boxes group each marker's controls (marker, wave + LFO, gain, filter, pitch, pan,
     arrange/clock) and the global ones (position + position LFO, pitch, master, outputs). -->
<svg xmlns="http://www.w3.org/2000/svg" width="182.88mm" height="128.5mm" viewBox="0 0 182.88 128.5" version="1.1">
  <g id="panel">
    <rect id="background" x="0" y="0" width="182.88" height="128.5" fill="#e9e7e2"/>
    <g id="marker-sections" fill="#d9d6cf">
      <rect x="6" y="11" width="10" height="32.5" rx="2" ry="2"/>
      <rect x="18" y="11" width="48" height="32.5" rx="2" ry="2"/>
      <rect x="68" y="11" width="12" height="32.5" rx="2" ry="2"/>
      <rect x="82" y="11" width="36" height="32.5" rx="2" ry="2"/>
      <rect x="120" y="11" width="18" height="32.5" rx="2" ry="2"/>
      <rect x="140" y="11" width="12" height="32.5" rx="2" ry="2"/>
      <rect x="154" y="11" width="22.88" height="32.5" rx="2" ry="2"/>
    </g>
    <rect id="screen" x="6" y="46" width="170.88" height="29.5" rx="2" ry="2" fill="#0f1115"/>
    <rect id="bar-track" x="14" y="64.9" width="154.88" height="1.2" rx="0.6" ry="0.6" fill="#3a3f52"/>
    <g id="control-sections" fill="#d9d6cf">
      <rect x="6" y="77.5" width="51" height="28.5" rx="2" ry="2"/>
      <rect x="59" y="77.5" width="22" height="28.5" rx="2" ry="2"/>
      <rect x="83" y="77.5" width="65" height="28.5" rx="2" ry="2"/>
    </g>
    <rect id="output-box" x="150" y="77.5" width="26.88" height="28.5" rx="2" ry="2" fill="#26282c"/>
    <rect id="dots-strip" x="6" y="108" width="170.88" height="12" rx="2" ry="2" fill="#0f1115"/>
  </g>
  <g id="components" style="display:none">
    <circle id="MARKER_BADGE" cx="11" cy="19" r="4" fill="#ffff00"/>
    <circle id="MARKER_WAVE_PARAM" cx="27" cy="19" r="4" fill="#ff0000"/>
    <circle id="MARKER_SMOOTH_PARAM" cx="27" cy="34" r="3" fill="#ff0000"/>
    <rect id="MARKER_LFO_SHAPE_PARAM" x="36.5" y="14" width="16" height="9" fill="#ff0000"/>
    <circle id="MARKER_LFO_RATE_PARAM" cx="59" cy="19" r="3" fill="#ff0000"/>
    <circle id="MARKER_LFO_AMT_PARAM" cx="60.5" cy="34" r="3" fill="#ff0000"/>
    <rect id="MARKER_LFO_SYNC_PARAM" x="37.1" y="31.8" width="6.8" height="4.4" fill="#ff0000"/>
    <rect id="MARKER_LFO_TRIPLET_PARAM" x="44.3" y="31.8" width="4.2" height="4.4" fill="#ff0000"/>
    <rect id="MARKER_LFO_DOTTED_PARAM" x="49.1" y="31.8" width="4.2" height="4.4" fill="#ff0000"/>
    <circle id="MARKER_GAIN_PARAM" cx="74" cy="19" r="4" fill="#ff0000"/>
    <circle id="MARKER_CUTOFF_PARAM" cx="92" cy="19" r="4" fill="#ff0000"/>
    <circle id="MARKER_DRIVE_PARAM" cx="108" cy="19" r="4" fill="#ff0000"/>
    <circle id="MARKER_RES_PARAM" cx="92" cy="34" r="3" fill="#ff0000"/>
