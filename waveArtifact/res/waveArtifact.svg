    <circle id="ARRANGE_PARAM" cx="165.44" cy="19" r="2.5" fill="#ff0000"/>
    <circle id="CLOCK_INPUT" cx="165.44" cy="34" r="4" fill="#00ff00"/>
    <rect id="MARKER_BAR" x="6" y="46" width="170.88" height="29.5" fill="#ffff00"/>
    <circle id="POSITION_PARAM" cx="14" cy="90.5" r="6" fill="#ff0000"/>
    <circle id="POS_ATTEN_PARAM" cx="27" cy="85" r="3" fill="#ff0000"/>
    <circle id="POS_INPUT" cx="27" cy="96.2" r="4" fill="#00ff00"/>
