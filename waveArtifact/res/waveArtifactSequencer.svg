<?xml version="1.0" encoding="UTF-8"?>
<!-- 30 HP panel for the waveArtifact sequencer. Geometry matches seqlayout in src/WaveArtifactSequencer.cpp.
     The grid and labels are drawn at runtime. -->
<svg xmlns="http://www.w3.org/2000/svg" width="152.4mm" height="128.5mm" viewBox="0 0 152.4 128.5" version="1.1">
  <g id="panel">
    <rect id="background" x="0" y="0" width="152.4" height="128.5" fill="#e9e7e2"/>
    <g id="sections" fill="#d9d6cf">
      <rect x="4" y="11" width="144.4" height="104" rx="2" ry="2"/>
    </g>
  </g>
</svg>
