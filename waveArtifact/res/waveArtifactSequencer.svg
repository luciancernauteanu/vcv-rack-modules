<?xml version="1.0" encoding="UTF-8"?>
<!-- 32 HP panel for the waveArtifact sequencer. Geometry matches seqlayout in src/WaveArtifactSequencer.cpp.
     The grid and labels are drawn at runtime. -->
<svg xmlns="http://www.w3.org/2000/svg" width="162.56mm" height="128.5mm" viewBox="0 0 162.56 128.5" version="1.1">
  <g id="panel">
    <rect id="background" x="0" y="0" width="162.56" height="128.5" fill="#e9e7e2"/>
    <g id="sections" fill="#d9d6cf">
      <rect x="4" y="11" width="154.56" height="104" rx="2" ry="2"/>
    </g>
    <rect id="gate-out-box" x="140.2" y="11.8" width="18.2" height="86.6" rx="1.5" ry="1.5" fill="#26282c"/>
  </g>
</svg>
